# dsh-desktop 自动发布流水线（技术文档 §3.2 / §13）
#
# 定时轮询上游 deepseek-ai/deepseek-harness 的最新 release tag；若有新版本
# （且本仓库尚未发布过该 tag 的产物），则自动：检出上游源码 → 构建 →
# 打包内容 tar.gz → 上传到本仓库 Release（资产先、清单后）。
#
# 平台矩阵（§13.3）：每个 runner 在自身平台上构建（原生依赖随平台），
# 各自上传资产 + 分平台清单片段；finalize job 合并为 latest.json。
#   - macos-13（Intel）→ darwin-x64
#   - macos-14（Apple Silicon）→ darwin-arm64
#   - windows-latest（x64）→ win32-x64
#
# 设备端升级逻辑不变：只检测本仓库 Release 的 latest.json，按 os+arch 匹配。
name: auto-release

on:
  schedule:
    - cron: '0 */6 * * *'          # 每 6 小时；上游发版后最多一个周期内就绪
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建并覆盖已发布的 tag'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false             # 某一平台失败不阻塞其他平台
      matrix:
        include:
          - os: macos-13           # Intel x64
            target_os: darwin
            arch: x64
          - os: macos-14           # Apple Silicon（arm64）
            target_os: darwin
            arch: arm64
          - os: windows-latest     # x64
            target_os: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout shell repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (pnpm)
        run: corepack enable
        shell: bash

      - name: Resolve latest upstream tag
        id: upstream
        run: |
          # /releases/latest 只返回 stable（非 prerelease），上游 rc 版是 prerelease → 404。
          # 改从远程 tag 列表取最高 dsh-v*（git 版本排序，含 rc）。
          TAG="$(git ls-remote --tags https://github.com/deepseek-ai/deepseek-harness.git 'dsh-v*' \
            | sed 's|.*refs/tags/||; s|\^{}$||' | sort -Vu | tail -1)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#dsh-v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Idempotency check (skip when already released)
        id: idem
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          FORCE="${{ github.event.inputs.force }}"
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .tag_name 2>/dev/null || true)"
          if [[ "${EXISTING}" == "${TAG}" && "${FORCE}" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "已发布过 ${TAG}，跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Clone upstream source
        if: steps.idem.outputs.skip != 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.upstream.outputs.tag }}" \
            https://github.com/deepseek-ai/deepseek-harness.git harness-src
        shell: bash

      - name: Resolve upstream commit
        id: commit
        if: steps.idem.outputs.skip != 'true'
        working-directory: harness-src
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build harness (upstream)
        if: steps.idem.outputs.skip != 'true'
        working-directory: harness-src
        env:
          # repositoryCommitHash() 优先读该变量，绕开构建目录无 .git 的问题（K-14）；
          # 必须是 commit hash（40 位十六进制），tag 名会被上游校验拒绝
          DSH_CLIENT_COMMIT_HASH: ${{ steps.commit.outputs.sha }}
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
        shell: bash

      - name: Package artifact + per-platform manifest (dry-run)
        if: steps.idem.outputs.skip != 'true'
        env:
          DSH_RELEASE_REF: harness-src
        run: |
          bash scripts/publish-release.sh "${{ steps.upstream.outputs.version }}" \
            --repo "${{ github.repository }}" --dry-run
        shell: bash

      - name: Upload artifact + platform manifest fragment
        if: steps.idem.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          FRAG="latest-${{ matrix.target_os }}-${{ matrix.arch }}.json"
          # 资产先：创建 Release 并上传 tar.gz
          gh release create "${TAG}" build/release-artifacts/*.tar.gz \
            --repo "${{ github.repository }}" \
            --title "${TAG}" \
            --notes "dsh-desktop 自动发布（上游 ${TAG}）" \
            || gh release upload "${TAG}" build/release-artifacts/*.tar.gz \
               --repo "${{ github.repository }}" --clobber
          # 分平台清单片段（finalize 合并），上传
          cp build/release-artifacts/latest.json "build/release-artifacts/${FRAG}"
          gh release upload "${TAG}" "build/release-artifacts/${FRAG}" \
            --repo "${{ github.repository }}" --clobber
          echo "已上传 ${TAG} 资产（${{ matrix.target_os }}-${{ matrix.arch }}）"
        shell: bash

  finalize:
    needs: release
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Collect platform manifest fragments
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [[ -z "${TAG}" ]]; then echo "无 Release，跳过 finalize"; exit 0; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          mkdir -p frags
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name' \
            | grep '^latest-' | while read -r n; do
              curl -sL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${n}" -o "frags/${n}"
            done
          ls frags/ 2>/dev/null || true
        shell: bash

      - name: Merge fragments into latest.json
        run: |
          ls frags/ >/dev/null 2>&1 || { echo "无片段，跳过"; exit 0; }
          python3 - <<'PY'
          import json, glob
          frags = sorted(glob.glob('frags/latest-*.json'))
          if not frags:
              raise SystemExit(0)
          merged = None
          for f in frags:
              m = json.load(open(f))
              if merged is None:
                  merged = m
              else:
                  merged['assets'].extend(m['assets'])
          merged['assets'] = sorted(merged['assets'], key=lambda a: (a['os'], a['arch']))
          json.dump(merged, open('latest.json', 'w'), indent=2, ensure_ascii=False)
          print('merged', len(merged['assets']), 'assets:', [a['name'] for a in merged['assets']])
          PY
        shell: bash

      - name: Upload merged latest.json (manifest last)
        if: steps.collect.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f latest.json
          gh release upload "${{ steps.collect.outputs.tag }}" latest.json \
            --repo "${{ github.repository }}" --clobber
          echo "latest.json 已更新（含全部平台资产）"
        shell: bash
