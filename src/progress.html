<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DeepSeek Harness</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: #1a1b1e; color: #e6e6e6;
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  #phase { color: #9aa0a6; margin: 0 0 12px; font-size: 12.5px; min-height: 18px; }
  #log {
    flex: 1; overflow: auto; background: #101113; border: 1px solid #2c2e33;
    border-radius: 6px; padding: 8px 10px; font: 11.5px/1.5 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-all; margin: 0 0 12px;
  }
  #log .dim { color: #6b6f76; }
  #actions { display: flex; justify-content: flex-end; gap: 8px; }
  button {
    background: #2f343d; color: #e6e6e6; border: 1px solid #3a4048; border-radius: 6px;
    padding: 6px 14px; font-size: 12.5px; cursor: pointer;
  }
  button:hover { background: #3a4048; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #0b5fff; border-color: #0b5fff; }
  button.primary:hover { background: #2a74ff; }
  .spinner {
    display: inline-block; width: 11px; height: 11px; border: 2px solid #4a4f57;
    border-top-color: #9aa0a6; border-radius: 50%; margin-right: 8px;
    vertical-align: -1px; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 12px; color: #9aa0a6; }
</style>
</head>
<body>
  <h1 id="title">DeepSeek Harness</h1>
  <p id="phase"><span class="spinner"></span><span id="phase-text">准备中…</span></p>
  <pre id="log"></pre>
  <div id="actions">
    <span id="status"></span>
    <button id="cancel">取消</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search)
    const mode = params.get('mode') || 'check'
    const titles = {
      check: '检查更新',
      apply: '正在更新',
      bootstrap: '首次安装',
    }
    const titleEl = document.getElementById('title')
    const phaseText = document.getElementById('phase-text')
    const logEl = document.getElementById('log')
    const cancelBtn = document.getElementById('cancel')
    const statusEl = document.getElementById('status')
    titleEl.textContent = 'DeepSeek Harness — ' + (titles[mode] || mode)
    if (mode === 'bootstrap') {
      statusEl.textContent = '正在解包应用内置的 DeepSeek Harness 版本（本地解压，约 1 分钟，无需联网下载）'
    } else if (mode === 'apply') {
      statusEl.textContent = '更新期间 GUI 会暂时中断，完成后自动重启'
    }

    const DONE = new Set(['done', 'error', 'cancelled'])
    const offPhase = window.dsh.onPhase(({ phase, detail }) => {
      phaseText.textContent = detail ? phase + ' — ' + detail : phase
      if (DONE.has(phase)) cancelBtn.disabled = true
    })
    const offLog = window.dsh.onLog((line) => {
      logEl.textContent += line + '\n'
      logEl.scrollTop = logEl.scrollHeight
    })
    cancelBtn.addEventListener('click', () => {
      cancelBtn.disabled = true
      phaseText.textContent = '正在取消…'
      window.dsh.cancelUpgrade()
    })
    window.addEventListener('beforeunload', () => { offPhase(); offLog() })
  </script>
</body>
</html>
